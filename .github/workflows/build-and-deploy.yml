# 再利用可能ワークフロー: ビルドと公開
#
# dist/ を作り、Firebase Hosting へ公開する。build と deploy を分けてあるのは
# 成果物を artifact として残し、公開物が何だったかを後から追えるようにするため。
#
# 認証は Workload Identity 連携を使うので、呼び出し側のジョブで
# id-token: write の権限と secrets: inherit を指定する必要がある。
name: Build and Deploy

on:
    workflow_call:
        secrets:
            WORKLOAD_IDENTITY_PROVIDER:
                required: true
            SERVICE_ACCOUNT:
                required: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            - name: Install Dependencies
              run: npm ci
            - name: Build Astro
              run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: dist-artifacts
                path: dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22.23.1
                cache: npm
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                name: dist-artifacts
                path: dist
            - name: Authentication for Google Cloud Platform
              id: auth
              uses: google-github-actions/auth@v2
              with:
                workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
                service_account: '${{ secrets.SERVICE_ACCOUNT }}'
                create_credentials_file: true
                export_environment_variables: true
            - name: Deploy to Firebase Hosting
              run: npx firebase-tools@15.22.1 deploy --only hosting
