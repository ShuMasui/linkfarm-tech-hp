name: CI/CD Pipeline
on:
    # main への push で「検査 → ビルド → 公開」まで通す。
    # PR では検査のみを走らせ、公開は main に入ってからに限定する。
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    # 前段階の検査。lint → test → build を通してから build ジョブへ進む。
    # ここが落ちれば build も deploy も走らないので、型エラーやテストの
    # 失敗が main に入ったまま公開されることを防げる。
    # ローカルでは make check が同じ内容を実行する。
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            - name: Install Dependencies
              run: npm ci
            - name: Lint, Test and Build
              run: make check

    # PR では走らせない。成果物が要るのは公開するときだけなので、
    # レビュー中のビルドは check ジョブのものだけで足りる。
    build:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: check
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            - name: Install Dependencies
              run: npm ci
            - name: Build Astro
              run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with: 
               name: dist-artifacts
               path: dist
    deploy:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Chekout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22.23.1
                cache: npm
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                name: dist-artifacts
                path: dist
            - name: Authentication for Google Cloud Platform
              id: auth
              uses: google-github-actions/auth@v2
              with:
                workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
                service_account: '${{ secrets.SERVICE_ACCOUNT }}'
                create_credentials_file: true
                export_environment_variables: true
            - name: Deploy to Firebase Hosting
              run: npx firebase-tools@15.22.1 deploy --only hosting
